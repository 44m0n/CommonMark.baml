name: test

on:
  push:
  pull_request:

jobs:
  baml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BAML
        run: |
          curl -fsSL https://baml.dev/install.sh | bash
          echo "$HOME/.baml/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select toolchain 0.19.1-nightly.20260911.a
        run: baml toolchain use 0.19.1-nightly.20260911.a
      - name: Check
        run: baml check
      - name: Test
        run: baml test
