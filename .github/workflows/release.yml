name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BAML_TOOLCHAIN: 0.19.1-nightly.20260911.a

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned BAML toolchain
        run: |
          set -eu
          curl -fsSL https://pkg.boundaryml.com/install.sh | sh -s -- \
            --no-modify-path --yes --version "$BAML_TOOLCHAIN"
          test -x "$HOME/.baml/bin/baml"
          echo "$HOME/.baml/bin" >> "$GITHUB_PATH"
      - name: Check
        run: baml check
      - name: Test
        run: baml test

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned BAML toolchain
        run: |
          set -eu
          curl -fsSL https://pkg.boundaryml.com/install.sh | sh -s -- \
            --no-modify-path --yes --version "$BAML_TOOLCHAIN"
          test -x "$HOME/.baml/bin/baml"
          echo "$HOME/.baml/bin" >> "$GITHUB_PATH"
      - name: Pack CLI
        run: baml pack cli.bamark --target "${{ matrix.target }}" --output ./bamark
      - name: Smoke-test Linux binary
        if: matrix.platform == 'linux'
        run: |
          set -eu
          test -x ./bamark
          expected="bamark ${GITHUB_REF_NAME#v} (CommonMark 0.31.2)"
          test "$(./bamark --version)" = "$expected"
          printf '# Release smoke test\n' > smoke.md
          test "$(./bamark smoke.md)" = '<h1>Release smoke test</h1>'
          test "$(printf '# Stdin\n' | ./bamark)" = '<h1>Stdin</h1>'
      - name: Prepare Windows executable
        if: matrix.platform == 'windows'
        run: |
          set -eu
          if [ -f ./bamark.exe ]; then
            :
          elif [ -f ./bamark ]; then
            mv ./bamark ./bamark.exe
          else
            echo 'baml pack did not produce bamark or bamark.exe' >&2
            exit 1
          fi
          test -s ./bamark.exe
      - name: Prepare archive
        run: |
          set -eu
          mkdir package
          if [ "${{ matrix.platform }}" = windows ]; then
            cp ./bamark.exe package/bamark.exe
          else
            cp ./bamark package/bamark
          fi
          cp LICENSE NOTICE package/
          archive="bamark-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd package && zip -q -r "../${archive}.zip" .)
          else
            tar -czf "${archive}.tar.gz" -C package bamark LICENSE NOTICE
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: bamark-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum bamark-* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/bamark-*
            dist/SHA256SUMS
