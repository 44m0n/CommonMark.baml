[package]
name = "CommonMark.baml"
# Pinned to tested BAML nightly 0.19.1-nightly.20260911.a.

# Language-bridge SDKs: `baml generate` writes `baml_sdk/` under each output_dir.
# Consumers install the matching runtime (`baml-bridge` / `@boundaryml/baml-bridge`)
# and import the generated package. Go and C# require naming_convention = "language".

[generator.python]
output_type = "python/pydantic"
output_dir = "generated/python"
naming_convention = "preserve-case"

[generator.typescript]
output_type = "typescript/node"
output_dir = "generated/typescript"
naming_convention = "preserve-case"

[toolchain]
version = "0.19.1-nightly.20260911.a"
